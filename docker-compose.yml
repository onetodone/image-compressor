name: image-compressor

x-app: &app
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: image-compressor:local
  platform: linux/amd64
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

services:
  api:
    <<: *app
    environment:
      NODE_ENV: production
      PORT: 8080
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-demo-image-compressor}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - '3001:8080'

  worker:
    <<: *app
    command: ['node', '--enable-source-maps', 'dist/main.worker.js']
    environment:
      NODE_ENV: production
      PORT: 8080
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-demo-image-compressor}
    ports:
      - '3002:8080'
