name: image-compressor

x-app: &app
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: image-compressor:local
  platform: linux/amd64
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

services:
  # Firebase Auth and Firestore emulators, so the stack runs without a Google Cloud project.
  emulators:
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-trixie-slim
        RUN apt-get update \
          && apt-get install -y --no-install-recommends openjdk-21-jre-headless \
          && rm -rf /var/lib/apt/lists/*
        RUN npm install -g firebase-tools@15.34.0
        WORKDIR /app
        COPY infra infra
        RUN sed -i 's/127.0.0.1/0.0.0.0/g' infra/firebase.json
        CMD ["firebase", "emulators:start", "--config", "infra/firebase.json", "--project", "demo-image-compressor", "--only", "auth,firestore"]
    image: image-compressor-emulators:local
    ports:
      - '9099:9099'
      - '8080:8080'
    restart: unless-stopped

  api:
    <<: *app
    environment:
      NODE_ENV: production
      PORT: 8080
      GCP_PROJECT_ID: demo-image-compressor
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
      FIRESTORE_EMULATOR_HOST: emulators:8080
      METADATA_SERVER_DETECTION: none
      TASKS_MODE: direct
      WORKER_URL: http://worker:8080
    depends_on:
      - emulators
      - worker
    ports:
      - '3001:8080'

  worker:
    <<: *app
    command: ['node', '--enable-source-maps', 'dist/main.worker.js']
    environment:
      NODE_ENV: production
      PORT: 8080
      GCP_PROJECT_ID: demo-image-compressor
      FIRESTORE_EMULATOR_HOST: emulators:8080
      METADATA_SERVER_DETECTION: none
      TASKS_MAX_ATTEMPTS: ${TASKS_MAX_ATTEMPTS:-5}
    depends_on:
      - emulators
    ports:
      - '3002:8080'

  # Static export of the web app. NEXT_PUBLIC_* values are embedded at build time; the browser
  # reaches the API and the emulators through the ports published above.
  web:
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-slim AS build
        RUN npm install -g corepack@latest && corepack enable
        WORKDIR /app
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json ./
        COPY apps/api/package.json apps/api/
        COPY apps/web/package.json apps/web/
        COPY packages/shared/package.json packages/shared/
        RUN pnpm install --frozen-lockfile --filter "@onetodone/image-compressor-web..."
        COPY packages/shared packages/shared
        COPY apps/web apps/web
        ARG NEXT_PUBLIC_API_URL
        ARG NEXT_PUBLIC_USE_EMULATORS
        ARG NEXT_PUBLIC_FIREBASE_API_KEY
        ARG NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        ARG NEXT_PUBLIC_FIREBASE_PROJECT_ID
        ARG NEXT_PUBLIC_FIREBASE_APP_ID
        RUN pnpm --filter "@onetodone/image-compressor-web..." run build

        FROM nginx:1-alpine
        COPY --from=build /app/apps/web/out /usr/share/nginx/html
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_USE_EMULATORS: 'true'
        NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-image-compressor.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-image-compressor
        NEXT_PUBLIC_FIREBASE_APP_ID: ''
    image: image-compressor-web:local
    depends_on:
      - api
    ports:
      - '3000:80'
    restart: unless-stopped
